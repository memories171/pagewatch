[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagewatch"
version = "0.2.0"
description = "轻量级网页变更监控器: 盯网页这件事交给程序, 你只收结果"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["web-monitor", "watchdog", "notification", "cli", "price-alert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/memories171/pagewatch"
Issues = "https://github.com/memories171/pagewatch/issues"

[project.scripts]
pagewatch = "pagewatch:main"

[tool.setuptools]
py-modules = ["pagewatch"]
